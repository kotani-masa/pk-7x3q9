function mqConnect(url){return loadMqtt().then(m=>new Promise((res,rej)=>{const c=m.connect(url,{clientId:'pk'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:7000,reconnectPeriod:2000,keepalive:30});let done=0;

const udTopic=(n,p)=>{const s=n.trim().normalize('NFKC')+'\n'+p;return TPRE+'u/'+udH(s,0xdeadbeef,0x41c6ce57)+udH(s,0x9e3779b9,0x7f4a7c15)};
let UDT=0,UDREADY=0,UDBUSY=0;const udAcc=()=>{try{const n=localStorage.udn,p=localStorage.udp;return n&&p?[n,p]:null}catch(_){return null}};

async function udPack(o){const raw=new TextEncoder().encode(JSON.stringify(o));if(window.CompressionStream){try{const b=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()),r=new Uint8Array(b.length+1);r[0]=1;r.set(b,1);return r}catch(_){}}const r=new Uint8Array(raw.length+1);r[0]=0;r.set(raw,1);return r}
async function udUnpack(u){u=new Uint8Array(u);let b=u.subarray(1);if(u[0]===1)b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());else if(u[0]!==0)throw 0;return JSON.parse(new TextDecoder().decode(b))}
function udApply(o){if(!o||!o.d||!o.d[HK])throw new Error('データが壊れています');const del=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(UDK(k))del.push(k)}del.forEach(k=>localStorage.removeItem(k));Object.entries(o.d).forEach(([k,v])=>{if(UDK(k))localStorage[k]=v});localStorage.udm=o.t||Date.now();

 const ok=(await udEach(c=>new Promise((res,rej)=>c.publish(t,buf,{qos:1,retain:true},e=>e?rej(e):res(1))))).length;if(!ok)throw new Error('サーバーにつながりません');if(!auto)udMsg('保存しました');return ok}finally{UDBUSY--}}
async function udFetch(){const a=udAcc();if(!a)throw new Error('ユーザー名と合言葉を入れてください');const t=udTopic(...a);

$('#nmk').onclick=async()=>{try{const pc=NET.pc=new RTCPeerConnection(RTC);pc.ondatachannel=e=>wire(e.channel);await pc.setRemoteDescription(dec($('#ninv').value));
 await pc.setLocalDescription(await pc.createAnswer());await gather(pc);$('#nresp').value=enc(pc.localDescription);nst('返答コードができました。ホストに送ってください。')}catch(x){nst('招待コードが正しくありません')}};
addEventListener('beforeunload',ev=>{if(P.some(p=>p.cards.length)){ev.preventDefault();ev.returnValue=''}});
render();
</script>
